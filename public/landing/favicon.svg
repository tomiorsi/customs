<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon. Separado de wabe-logo.svg (que es la marca apaisada 100x70 del
       footer y no se toca): Google Search recorta el favicon en circulo y lo
       muestra a ~28px. Con fondo transparente la marca, que es ancha y baja,
       queda flotando chiquita en un circulo gris — asi se veia en el anuncio.
       Por eso aca el fondo llega al borde y las ondas van en blanco. -->
  <!-- rx=22: mismo radio proporcional que usa el ícono de app de iOS/macOS
       (~22% del lado), que es lo que hace que se lea "redondeado" al lado de
       los demás en la barra de pestañas — cuadrado se notaba. No afecta a
       Google Search: ahí el recorte es circular y las esquinas caen afuera
       igual, con o sin radio. -->
  <rect width="100" height="100" rx="22" fill="#4d95d4"/>
  <g transform="translate(50,50) scale(0.80) translate(-50,-35)"
     stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 0 12 C 12 0 18 0 25 12 S 38 24 50 12 S 62 0 75 12 S 88 24 100 12"/>
    <path d="M 0 35 C 12 23 18 23 25 35 S 38 47 50 35 S 62 23 75 35 S 88 47 100 35"/>
    <path d="M 0 58 C 12 46 18 46 25 58 S 38 70 50 58 S 62 46 75 58 S 88 70 100 58"/>
  </g>
</svg>
